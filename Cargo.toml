[package]
name = "light-game"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = { version="0.7.0", default_features = false }
bevy_pixels = "0.5.0"

vulkano-shaders = "0.30.0"
vulkano = "0.30.0"
vulkano-win = "0.30.0"
vulkano-util = "0.30.0"
winit = "0.26"
bytemuck = { version = "1.7", features = ["derive", "extern_crate_std", "min_const_generics"] }

rand = "0.8.5"
nalgebra = "*"
nalgebra-glm = "0.17.0"
